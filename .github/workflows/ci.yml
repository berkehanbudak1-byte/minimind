name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  security-and-swarm-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install fastapi httpx pydantic pytest
      - name: Run API security and swarm orchestrator tests
        run: python3 -m pytest -q tests/test_api_security.py tests/test_swarm_orchestrator.py
