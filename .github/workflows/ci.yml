name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  security-and-swarm-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pip && pip install fastapi httpx pydantic
      - name: Syntax check Python sources with py_compile
        run: python3 -m py_compile eval_llm.py model/*.py scripts/*.py trainer/*.py tests/*.py
      - name: Run unit tests (model-free)
        run: python3 -m unittest discover -s tests -v
